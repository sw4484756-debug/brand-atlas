name: Validate report generator
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python3 -m unittest discover -s tests -v
      - run: node --check assets/report.js
      - run: node --test tests/report_math.test.cjs
      - run: python3 scripts/validate_report.py examples/demo.json
      - run: python3 scripts/render_report.py examples/demo.json --out /tmp/report.html
