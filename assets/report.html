<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="description" content="Bilingual brand positioning research and interactive scenario editor."><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; font-src 'none'; connect-src 'self'; frame-src 'self'; base-uri 'none'; form-action 'none'"><title>__REPORT_TITLE__ · Brand Atlas</title><style>/*__REPORT_CSS__*/</style></head>
<body>
<header class="topbar"><a href="#" class="wordmark" aria-label="Brand Atlas"><span>Brand Atlas</span></a><div class="header-meta"><span class="status-dot"></span><span id="mode-label"></span></div><div class="header-actions"><select id="language" aria-label="Language / 语言"><option value="zh">中文</option><option value="en">English</option></select><button class="button quiet" id="research-settings" data-i18n="researchSettings"></button><button class="button quiet" id="save-html" data-i18n="saveHTML"></button><button class="button quiet" id="print-btn" data-i18n="print"></button></div></header>
<div class="shell"><aside class="sidebar"><h2 data-i18n="research"></h2><div class="scope"><span data-i18n="category"></span><strong id="category"></strong><span data-i18n="market"></span><strong id="market"></strong></div><div class="side-label"><span data-i18n="brands"></span><span id="brand-count"></span></div><div id="brand-list"></div><div class="side-label dimension-heading"><span data-i18n="dimensions"></span><span id="dimension-count"></span></div><div id="dimension-list"></div><button class="button download-data" id="json-btn" data-i18n="saveJSON"></button><label class="button download-data import-label"><span data-i18n="restoreJSON"></span><input id="import-json" type="file" accept="application/json,.json"></label></aside>
<main><div class="intro"><div><h1 id="report-title"></h1></div><div class="date-block"><span data-i18n="researchDate"></span><strong id="date"></strong></div></div><div id="scope-banner" class="notice"></div><div id="research-status" class="notice research-status" role="status" aria-live="polite" hidden><span id="research-status-text"></span><button class="button quiet" id="cancel-research" data-i18n="cancelResearch" hidden></button></div><div id="scenario-banner" class="notice scenario" hidden></div><div id="translation-banner" class="notice" hidden></div>
<nav class="tabs" aria-label="Report"><button class="tab active" data-tab="map" aria-current="page" data-i18n="mapTab"></button><button class="tab" data-tab="discovery" data-i18n="discoverTab"></button><button class="tab" data-tab="matrix" data-i18n="matrixTab"></button><button class="tab" data-tab="strategy" data-i18n="strategyTab"></button><button class="tab" data-tab="sources" data-i18n="sourcesTab"></button></nav>
<section id="panel-map" class="panel active"><div class="map-layout"><div class="chart-card"><div class="card-heading"><div><h2 data-i18n="mapTitle"></h2><p data-i18n="mapHint"></p></div><button class="button" id="png-btn" data-i18n="exportPNG"></button></div>
<div class="axis-controls"><label><span class="axis-tag">X</span><select id="x-axis" data-aria="xAxis"></select></label><button class="swap-button" id="swap-btn" data-aria="swap">⇄</button><label><span class="axis-tag">Y</span><select id="y-axis" data-aria="yAxis"></select></label><span class="scale-note">0 — 100</span></div>
<div class="style-controls"><label><span data-i18n="palette"></span><select id="palette" data-aria="palette"></select></label><label><span data-i18n="style"></span><select id="map-style" data-aria="style"></select></label><label class="check-control"><input type="checkbox" id="edit-mode"><span data-i18n="dragMode"></span></label></div>
<div class="plot-wrap"><svg id="plot" viewBox="0 0 800 510" role="group" data-aria="plot"></svg></div><div id="map-legend" class="legend"></div><div id="missing" class="missing" hidden></div><div class="chart-foot"><span data-i18n="ring"></span><span data-i18n="keyboard"></span></div>
<details class="editor" id="editor"><summary data-i18n="editorTitle"></summary><div class="editor-body"><div class="edit-section"><h3 data-i18n="editAxes"></h3><div class="axis-edit-grid" id="axis-edit-fields"></div><div class="button-row"><button class="button primary" id="research-axes" data-i18n="researchAxes"></button><button class="button" id="apply-axis" data-i18n="applyLabels"></button></div><p class="helper" data-i18n="renameNote"></p></div><div class="edit-section"><h3 data-i18n="addDimension"></h3><div class="form-grid"><label><span data-i18n="dimensionName"></span><input id="new-name" maxlength="40" data-aria="dimensionName"></label><label><span data-i18n="low"></span><input id="new-low" maxlength="40" data-aria="newLow"></label><label><span data-i18n="high"></span><input id="new-high" maxlength="40" data-aria="newHigh"></label></div><div id="dimension-presets" class="preset-row"></div><div class="button-row"><button class="button primary" id="research-dimension" data-i18n="researchDimension"></button><button class="button" id="add-dimension" data-i18n="add"></button></div><p class="helper" data-i18n="newDimensionNote"></p></div><div class="edit-section"><h3 data-i18n="editPoint"></h3><div class="form-grid point-fields"><label><span data-i18n="brand"></span><select id="edit-brand" data-aria="editBrand"></select></label><label><span>X (0–100)</span><input id="point-x" type="number" min="0" max="100" step="0.1" aria-label="X coordinate"></label><label><span>Y (0–100)</span><input id="point-y" type="number" min="0" max="100" step="0.1" aria-label="Y coordinate"></label><label><span data-i18n="pointColor"></span><input type="color" id="point-color" data-aria="pointColor"></label></div><div class="button-row"><button class="button" id="apply-point" data-i18n="applyPoint"></button><button class="button quiet" id="reset-point" data-i18n="resetPoint"></button><label class="button import-label"><span data-i18n="uploadLogo"></span><input type="file" id="logo-file" accept="image/png,image/jpeg,image/webp"></label><button class="button quiet" id="remove-logo" data-i18n="removeLogo"></button></div><p class="helper" data-i18n="logoNote"></p></div><button class="button quiet" id="reset-edits" data-i18n="resetEdits"></button></div></details></div><aside class="insight-card"><h2 data-i18n="viewTitle"></h2><div id="view-analysis" class="view-analysis"></div><div class="detail-divider"></div><div id="brand-detail"></div></aside></div><div class="section-heading"><div><h2 data-i18n="perspectives"></h2></div><p data-i18n="pairMethod"></p></div><div id="perspectives" class="perspectives"></div></section>
<section id="panel-discovery" class="panel"><div class="discovery-hero"><h2 data-i18n="discoverTitle"></h2><p data-i18n="discoveryNote"></p><div class="search-row"><select id="search-mode" data-aria="searchMode"></select><input id="search-query" data-aria="searchQuery" maxlength="300"><select id="country-filter" data-aria="country"></select><button class="button primary" id="search-btn" data-i18n="search"></button></div><div class="button-row"><button class="button" id="local-search-btn" data-i18n="localSearch"></button><button class="button" id="all-brands" data-i18n="allBrands"></button><button class="button" id="region-brands" data-i18n="regionBrands"></button></div></div><div class="section-heading"><h2 data-i18n="candidates"></h2><p id="candidate-count"></p></div><div id="candidate-list" class="profiles"></div></section>
<section id="panel-matrix" class="panel"><div class="white-panel"><div class="card-heading"><div><h2 data-i18n="matrixTitle"></h2><p data-i18n="matrixHint"></p></div></div><div class="table-scroll"><table id="matrix"></table></div><div id="matrix-detail" class="matrix-detail" aria-live="polite"></div></div><div class="section-heading"><h2 data-i18n="profiles"></h2></div><div id="brand-profiles" class="profiles"></div></section>
<section id="panel-strategy" class="panel"><div class="summary-box"><h2 data-i18n="strategyTitle"></h2><p id="summary"></p><div id="summary-refs"></div></div><div class="section-heading"><h2 data-i18n="competitiveness"></h2><p data-i18n="baselineNote"></p></div><div id="competitive-analysis" class="profiles"></div><div class="section-heading"><h2 data-i18n="opportunitiesTitle"></h2><p data-i18n="inference"></p></div><div id="opportunities"></div><div class="limitations"><h3 data-i18n="limits"></h3><ul id="strategy-limits"></ul></div></section>
<section id="panel-sources" class="panel"><div class="section-heading first"><div><h2 data-i18n="sourcesTitle"></h2></div><span class="pill" id="source-count"></span></div><div id="source-list"></div><div id="search-attribution"></div><div class="section-heading"><h2 data-i18n="method"></h2></div><div id="rubrics" class="rubrics"></div><div class="limitations"><h3 data-i18n="limits"></h3><ul id="source-limits"></ul></div></section>
<footer class="footer"><span>Brand Atlas</span><span data-i18n="notSurvey"></span></footer></main></div><div id="toast" class="toast" role="status" hidden></div><dialog id="settings-dialog" aria-labelledby="settings-title"><div class="settings-heading"><h2 id="settings-title" data-i18n="researchSettings"></h2><button class="button quiet" id="close-settings" data-i18n="closeSettings"></button></div><p class="settings-intro" data-i18n="settingsIntro"></p><label class="settings-field"><span data-i18n="researchProvider"></span><select id="provider-select" data-aria="researchProvider"><option value="host" data-i18n="hostProvider"></option><option value="deepseek">DeepSeek</option><option value="gemini">Gemini</option></select></label><div id="provider-fields" hidden><label class="settings-field"><span data-i18n="modelName"></span><input id="provider-model" maxlength="100" autocomplete="off" spellcheck="false" data-aria="modelName"></label><label class="settings-field"><span>API Key</span><input id="provider-key" type="password" maxlength="512" autocomplete="off" spellcheck="false" aria-label="API Key"></label><p class="helper" id="key-state"></p><p class="helper" data-i18n="apiDisclosure"></p><button class="button quiet" id="clear-provider-key" data-i18n="clearKey"></button></div><p id="settings-status" role="status" class="helper"></p><div class="button-row"><button class="button primary" id="save-settings" data-i18n="saveSettings"></button></div></dialog><script id="report-data" type="application/json">/*__REPORT_DATA__*/</script><script>/*__REPORT_JS__*/</script></body></html>
